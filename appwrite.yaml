projectID: 695f9b250005a6c99e08
projectName: Vet2u-Web
version: 1.0.0
license: MIT
description: "Vet2u Flutter Web Application - Deployed on Appwrite"

web:
  enabled: true
  # Specify the web build directory
  path: build/web
  # Set to true to compress files
  compress: true
  # Ignored files pattern
  ignore:
    - ".git"
    - ".*"
    - "node_modules"
    - "test"
    - "build/android"
    - "build/ios"
    - "build/linux"
    - "build/macos"
    - "build/windows"

cors:
  # Allowed origins for your web app
  origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "https://fra.cloud.appwrite.io"
    # Add your custom domain when configured
    # - "https://your-domain.com"

auth:
  # Authentication configuration
  sessions:
    enabled: true
    # Timeout in seconds (30 days = 2592000)
    timeout: 2592000
  
  # Enable/disable various auth providers
  providers:
    email: true
    magicURL: true
    phone: true

database:
  enabled: true

storage:
  enabled: true
  # Maximum file size in MB
  maxFileSize: 100
  # Allowed file extensions
  allowedExtensions:
    - jpg
    - jpeg
    - png
    - gif
    - pdf
    - doc
    - docx
    - mp4
    - webm

functions:
  enabled: true
  # Maximum function timeout in seconds (900 = 15 minutes)
  timeout: 900

messaging:
  enabled: true

