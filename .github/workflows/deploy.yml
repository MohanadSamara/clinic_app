name: Deploy app and proxy

on:
  push:
    branches: [ main ]

env:
  REGION: us-central1
  CLOUD_RUN_SERVICE: qdrant-proxy
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT }}/qdrant-proxy

jobs:
  deploy-proxy:
    name: Build & Deploy Proxy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      proxy_url: ${{ steps.get-proxy-url.outputs.proxy_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Google
        run: |-
          gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |-
          docker build -t $IMAGE:latest server-proxy
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image $IMAGE:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: Get Cloud Run URL
        id: get-proxy-url
        run: |
          PROXY_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "proxy_url=$PROXY_URL" >> $GITHUB_OUTPUT

  deploy-web:
    name: Build Flutter web and deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          BASE_HREF="/${GITHUB_REPOSITORY#*/}/"
          flutter build web --release --base-href $BASE_HREF --dart-define=QDRANT_PROXY_BASE=${{ needs.deploy-proxy.outputs.proxy_url }}/qdrant

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
